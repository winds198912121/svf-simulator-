<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVF デバッグチェック</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f8fafc;
        }
        .check-item {
            background: white;
            padding: 16px;
            margin: 12px 0;
            border-radius: 8px;
            border-left: 4px solid #cbd5e1;
        }
        .check-item.pass {
            border-left-color: #22c55e;
        }
        .check-item.fail {
            border-left-color: #ef4444;
        }
        .check-title {
            font-weight: 600;
            margin-bottom: 8px;
        }
        .check-result {
            font-family: monospace;
            font-size: 13px;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 4px;
            margin-top: 8px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px 5px 10px 0;
        }
        button:hover {
            background: #1d4ed8;
        }
        h1 { color: #0f172a; }
        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 SVF シミュレーター デバッグチェック</h1>

    <button onclick="runAllChecks()">🔄 全チェック実行</button>
    <button onclick="clearStorage()">🗑️ LocalStorage クリア</button>
    <button onclick="window.location.href='index-ja.html'">↗️ SVF を開く</button>

    <div id="results"></div>

    <script>
        function addResult(title, content, pass = null) {
            const div = document.createElement('div');
            div.className = 'check-item' + (pass !== null ? (pass ? ' pass' : ' fail') : '');
            div.innerHTML = `
                <div class="check-title">${pass === true ? '✅' : pass === false ? '❌' : '🔍'} ${title}</div>
                <div class="check-result">${content}</div>
            `;
            document.getElementById('results').appendChild(div);
        }

        function runAllChecks() {
            document.getElementById('results').innerHTML = '';

            // 1. LocalStorage チェック
            try {
                const templates = localStorage.getItem('svf_templates');
                if (templates) {
                    const parsed = JSON.parse(templates);
                    const count = Object.keys(parsed).length;
                    addResult('LocalStorage 確認',
                        `保存されているテンプレート: ${count}個\n` +
                        `テンプレート名:\n${Object.keys(parsed).map(k => '  - ' + k).join('\n')}`,
                        true
                    );
                } else {
                    addResult('LocalStorage 確認', '保存されているテンプレートはありません', true);
                }
            } catch (err) {
                addResult('LocalStorage 確認', 'エラー: ' + err.message, false);
            }

            // 2. HTML 要素チェック
            fetch('index-ja.html')
                .then(r => r.text())
                .then(html => {
                    const checks = [
                        { id: 'modal-load', name: '読込モーダル' },
                        { id: 'template-load-list', name: '読込リスト' },
                        { id: 'modal-save', name: '保存モーダル' },
                        { id: 'template-grid', name: 'テンプレートグリッド' }
                    ];

                    let result = '';
                    let allPass = true;

                    checks.forEach(check => {
                        const found = html.includes(`id="${check.id}"`);
                        result += `${found ? '✓' : '✗'} ${check.name} (${check.id}): ${found ? '存在' : '不在'}\n`;
                        if (!found) allPass = false;
                    });

                    addResult('HTML 要素確認', result, allPass);
                })
                .catch(err => {
                    addResult('HTML 要素確認', 'エラー: ' + err.message, false);
                });

            // 3. JavaScript ファイルチェック
            fetch('js/app-ja.js')
                .then(r => r.text())
                .then(js => {
                    const methods = [
                        'loadTemplate',
                        'renderTemplateGrid',
                        'loadSavedTemplate',
                        'deleteTemplate',
                        'escapeHtml'
                    ];

                    let result = '';
                    let allPass = true;

                    methods.forEach(method => {
                        const found = js.includes(method + '(');
                        result += `${found ? '✓' : '✗'} ${method}(): ${found ? '定義済み' : '未定義'}\n`;
                        if (!found) allPass = false;
                    });

                    addResult('JavaScript メソッド確認', result, allPass);
                })
                .catch(err => {
                    addResult('JavaScript メソッド確認', 'エラー: ' + err.message, false);
                });

            // 4. CSS ファイルチェック
            fetch('css/main.css')
                .then(r => r.text())
                .then(css => {
                    const classes = [
                        '.template-load-list',
                        '.template-load-item',
                        '.template-load-icon',
                        '.template-card.custom'
                    ];

                    let result = '';
                    let allPass = true;

                    classes.forEach(cls => {
                        const found = css.includes(cls);
                        result += `${found ? '✓' : '✗'} ${cls}: ${found ? '定義済み' : '未定義'}\n`;
                        if (!found) allPass = false;
                    });

                    addResult('CSS クラス確認', result, allPass);
                })
                .catch(err => {
                    addResult('CSS クラス確認', 'エラー: ' + err.message, false);
                });
        }

        function clearStorage() {
            if (confirm('本当にLocalStorageをクリアしますか？全てのテンプレートが削除されます。')) {
                localStorage.clear();
                alert('LocalStorageをクリアしました');
                runAllChecks();
            }
        }

        // 自動実行
        runAllChecks();
    </script>
</body>
</html>
